<anglify-simple-table [fixedHeader]="true">
  <thead>
    <tr>
      <th class="text-left">Name</th>
      <th class="text-left">Calories Very Long Column Name</th>
    </tr>
  </thead>
  <tbody>
    @for (item of desserts; track item) {
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.calories }}</td>
      </tr>
    }
  </tbody>
  <tfoot>
    <tr>
      <td>Sum</td>
      <td>Total</td>
    </tr>
  </tfoot>
</anglify-simple-table>
