<h2>Styling</h2>

<anglify-simple-table>
  <tr>
    <th>Name</th>
    <th>Default value</th>
  </tr>
  @for (variable of cssVariables$ | async; track variable) {
    <tr>
      <td>
        @if (variable.name) {
          <code>{{ variable.name }}</code>
        }
      </td>
      <td>
        @if (variable.defaultValue) {
          <code>{{ variable.defaultValue }}</code>
        }
      </td>
    </tr>
  }
</anglify-simple-table>
