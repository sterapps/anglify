@for (type of typography; track trackByFn($index, type)) {
  <div
    class="container"
    [ngClass]="type.name"
    anglifyInteractionState
    (click)="toggleTypeDetails(type)"
    tabindex="0"
    (keydown.space)="$event.preventDefault(); toggleTypeDetails(type)"
    (keydown.enter)="$event.preventDefault(); toggleTypeDetails(type)"
  >
    <div>{{ type.title }}</div>
    <anglify-icon icon="mdi-chevron-down" [@rotate]="(activeTypography$ | async) === type.name"></anglify-icon>
  </div>
  @if ((activeTypography$ | async) === type.name) {
    <div class="custom-properties" @fast-in-fast-out-y>
      <pre><code class="language-scss" [innerHTML]="type.customProperties | highlight: 'scss'"></code></pre>
    </div>
  }
}
