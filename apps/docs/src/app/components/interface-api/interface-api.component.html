@if (properties$ | async; as properties) {
  <h3>Properties</h3>
  <anglify-simple-table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
      </tr>
    </thead>
    <tbody>
      @for (property of properties; track property) {
        <tr>
          <td>{{ property.name }}</td>
          <td>{{ property.type }}</td>
        </tr>
      }
    </tbody>
  </anglify-simple-table>
}
