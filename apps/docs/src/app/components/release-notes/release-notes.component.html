@for (release of releases$ | async; track release) {
  <div class="release">
    <div class="header">
      <h2>
        <a [href]="release.html_url" target="_blank" rel="noopener noreferrer">{{ release.tag_name }}</a>
      </h2>
      @if (release.prerelease) {
        <anglify-chip appearance="outlined">Pre-release</anglify-chip>
      }
    </div>
    <div [innerHTML]="release.body | markdown | async"></div>
  </div>
}
