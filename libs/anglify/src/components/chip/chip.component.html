@if (!(slots | findSlot: 'prepend') && filter) {
  <div class="prepend">
    <anglify-icon [icon]="internalIcons.check"></anglify-icon>
  </div>
}
@if (slots | findSlot: 'prepend') {
  <div class="prepend">
    <ng-container *anglifySlotOutlet="slots | findSlot: 'prepend'"></ng-container>
  </div>
}
<ng-content></ng-content>
@if (slots | findSlot: 'append') {
  <div class="append">
    <ng-container *anglifySlotOutlet="slots | findSlot: 'append'"></ng-container>
  </div>
}
