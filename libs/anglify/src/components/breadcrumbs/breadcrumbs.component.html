@for (item of items; track item; let index = $index; let length = $count) {
  @if (item.href && !item.routerLink) {
    <a [href]="item.href">
      {{ item.text }}
    </a>
  }
  @if (item.routerLink && !item.href) {
    <a
      [class.disabled]="item.disabled"
      [routerLink]="item.routerLink"
      routerLinkActive="active"
      [routerLinkActiveOptions]="item.matchOptions ?? { exact: true }"
    >
      {{ item.text }}
    </a>
  }
  @if (index !== length - 1) {
    <div class="divider">
      <ng-container *anglifySlotOutlet="slots | findSlot: 'divider'">{{ divider }}</ng-container>
    </div>
  }
}
