<div class="prepend-item">
  @if (topStepConnectionLineVisible$ | async) {
    <div class="step-connection-line top"></div>
  }
  @if (bottomStepConnectionLineVisible$ | async) {
    <div class="step-connection-line bottom"></div>
  }
  <div class="step-indicator">
    @if (visited && (active$ | async) === false) {
      <div>
        <ng-container *anglifySlotOutlet="slots | findSlot: 'visitedIcon'"></ng-container>
      </div>
    } @else {
      {{ ((index$ | async) ?? -1) + 1 }}
    }
  </div>
</div>
<div class="label">{{ label$ | async }}</div>
