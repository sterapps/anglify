@if (slots | findSlot: 'icon') {
  <div class="icon">
    <ng-template *anglifySlotOutlet="slots | findSlot: 'icon'"></ng-template>
  </div>
}
@if ((slots | findSlot: 'label') && (shift$ | async) && (active$ | async)) {
  <div class="label">
    <ng-template *anglifySlotOutlet="slots | findSlot: 'label'"></ng-template>
  </div>
}
@if ((slots | findSlot: 'label') && (shift$ | async) === false) {
  <div class="label">
    <ng-template *anglifySlotOutlet="slots | findSlot: 'label'"></ng-template>
  </div>
}
