@if ((hideOpposite$ | async) === false) {
  <div class="opposite-container">
    <ng-container *anglifySlotOutlet="slots | findSlot: 'opposite'"></ng-container>
  </div>
}
<div class="indicator-container">
  @if (topConnectionLineVisible) {
    <div class="connection-line top"></div>
  }
  @if (bottomConnectionLineVisible) {
    <div class="connection-line bottom"></div>
  }
  <div class="indicator">
    <div><ng-container *anglifySlotOutlet="slots | findSlot: 'indicator'"></ng-container></div>
  </div>
</div>
<div class="content-container">
  <ng-content></ng-content>
</div>
