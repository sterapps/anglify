<div class="toolbar-container">
  @if (!collapse && (slots | findSlot: 'start')) {
    <div class="start">
      <ng-template *anglifySlotOutlet="slots | findSlot: 'start'"></ng-template>
    </div>
  }
  @if (!collapse) {
    <div class="center">
      <ng-content></ng-content>
    </div>
  }
  @if (slots | findSlot: 'end') {
    <div class="end">
      <ng-container *anglifySlotOutlet="slots | findSlot: 'end'"></ng-container>
    </div>
  }
</div>
@if (slots | findSlot: 'extension') {
  <div class="extension-container">
    <ng-container *anglifySlotOutlet="slots | findSlot: 'extension'"></ng-container>
  </div>
}
