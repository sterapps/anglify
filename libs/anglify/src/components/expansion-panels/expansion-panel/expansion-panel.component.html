<div
  class="anglify-expansion-panel-header"
  (click)="onClick.next()"
  (keydown.space)="$event.preventDefault(); onClick.next()"
  (keydown.enter)="$event.preventDefault(); onClick.next()"
  tabindex="0"
  anglifyInteractionState
  [active]="false"
>
  <ng-container *anglifySlotOutlet="slots | findSlot: 'header'">{{ label }}</ng-container>
  <ng-container *anglifySlotOutlet="slots | findSlot: 'append'">
    @if (!hideToggle) {
      <anglify-icon [icon]="internalIcons.chevronDown" [@rotate]="active$ | async"></anglify-icon>
    }
  </ng-container>
</div>
@if (active$ | async) {
  <div @fast-in-fast-out-y>
    <div class="anglify-expansion-panel-content">
      <ng-content></ng-content>
    </div>
  </div>
}
